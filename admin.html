<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Unificado - Dante Propiedades</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 12px;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 2.5rem 2rem;
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #10b981);
        }
        
        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .user-info {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1e3c72, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-trend {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .stat-trend.up {
            background: #d1fae5;
            color: #065f46;
        }
        
        .stat-trend.down {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .tabs {
            display: flex;
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        
        .tab {
            flex: 1;
            padding: 1.25rem 2rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-muted);
        }
        
        .tab:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }
        
        .tab.active {
            border-bottom-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
        }
        
        .tab:hover:not(.active) {
            background: #f8fafc;
            color: var(--text-main);
        }
        
        .tab-content {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-content.active {
            display: block;
        }
        
        .tab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .filters {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .search-box {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            width: 300px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .select-filter {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: white;
            font-size: 0.95rem;
            min-width: 150px;
        }
        
        .citas-grid, .leads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .cita-card, .lead-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .cita-card::before, .lead-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--success));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .cita-card:hover::before, .lead-card:hover::before {
            opacity: 1;
        }
        
        .cita-card:hover, .lead-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .card-id {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            background: var(--bg);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
        }
        
        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .status-pendiente {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-confirmada {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-cancelada {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status-completada {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .card-content {
            margin-bottom: 1.5rem;
        }
        
        .card-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        
        .card-row i {
            width: 20px;
            color: var(--text-muted);
            text-align: center;
        }
        
        .property-info {
            background: #f0f9ff;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin: 1rem 0;
            border-left: 3px solid var(--primary);
        }
        
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        
        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background: #0da271;
            transform: translateY(-1px);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: var(--danger-dark);
            transform: translateY(-1px);
        }
        
        .btn-outline {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        
        .btn-outline:hover:not(:disabled) {
            background: var(--bg);
            border-color: var(--primary);
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-muted);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        
        .page-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .page-btn:hover:not(.active) {
            background: var(--bg);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
        }
        
        .modal-close:hover {
            background: var(--bg);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }
        
        .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.25rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header {
                padding: 1.5rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .user-info {
                position: static;
                margin-top: 1rem;
                width: fit-content;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                padding: 1rem;
                justify-content: flex-start;
            }
            
            .tab-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filters {
                flex-direction: column;
                width: 100%;
            }
            
            .search-box, .select-filter {
                width: 100%;
            }
            
            .citas-grid, .leads-grid {
                grid-template-columns: 1fr;
            }
            
            .card-actions {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Dante Propiedades - Panel Unificado</h1>
            <p>Gestión completa de leads y citas en un solo lugar</p>
            <div class="user-info" id="user-info">
                <!-- Usuario cargado dinámicamente -->
            </div>
        </div>
        
        <div class="stats-grid" id="stats-grid">
            <!-- Estadísticas cargadas dinámicamente -->
        </div>
        
        <div class="tabs" role="tablist">
            <button class="tab active" onclick="mostrarTab('citas')" role="tab" aria-selected="true" aria-controls="tab-citas">
                <span>📅</span> Citas Agendadas
            </button>
            <button class="tab" onclick="mostrarTab('leads')" role="tab" aria-selected="false" aria-controls="tab-leads">
                <span>👥</span> Todos los Leads
            </button>
            <button class="tab" onclick="mostrarTab('exportar')" role="tab" aria-selected="false" aria-controls="tab-exportar">
                <span>📤</span> Exportar Datos
            </button>
            <button class="tab" onclick="mostrarTab('configuracion')" role="tab" aria-selected="false" aria-controls="tab-configuracion">
                <span>⚙️</span> Configuración
            </button>
        </div>
        
        <!-- Tab Citas -->
        <div id="tab-citas" class="tab-content active" role="tabpanel" aria-labelledby="citas-tab">
            <div class="tab-header">
                <h2>📅 Citas Agendadas</h2>
                <div class="filters">
                    <input type="text" class="search-box" placeholder="🔍 Buscar citas..." oninput="filtrarCitas(this.value)">
                    <select class="select-filter" onchange="filtrarCitasPorEstado(this.value)">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="confirmada">Confirmada</option>
                        <option value="completada">Completada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                    <button class="btn btn-primary" onclick="mostrarModalNuevaCita()">
                        <span>➕</span> Nueva Cita
                    </button>
                </div>
            </div>
            <div class="citas-grid" id="citas-container">
                <!-- Citas cargadas dinámicamente -->
            </div>
            <div class="pagination" id="citas-pagination"></div>
        </div>
        
        <!-- Tab Leads -->
        <div id="tab-leads" class="tab-content" role="tabpanel" aria-labelledby="leads-tab">
            <div class="tab-header">
                <h2>👥 Todos los Leads</h2>
                <div class="filters">
                    <input type="text" class="search-box" placeholder="🔍 Buscar leads..." oninput="filtrarLeads(this.value)">
                    <select class="select-filter" onchange="filtrarLeadsPorFuente(this.value)">
                        <option value="">Todas las fuentes</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="telefono">Teléfono</option>
                        <option value="web">Web</option>
                        <option value="referido">Referido</option>
                    </select>
                </div>
            </div>
            <div class="leads-grid" id="leads-container">
                <!-- Leads cargados dinámicamente -->
            </div>
            <div class="pagination" id="leads-pagination"></div>
        </div>
        
        <!-- Tab Exportar -->
        <div id="tab-exportar" class="tab-content" role="tabpanel" aria-labelledby="exportar-tab">
            <h2>📤 Exportar Datos</h2>
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <label class="form-label">Tipo de datos:</label>
                    <select class="form-control" id="export-type">
                        <option value="citas">Citas Agendadas</option>
                        <option value="leads">Todos los Leads</option>
                        <option value="excel">Leads.xlsx (Completo)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Rango de fechas:</label>
                    <div style="display: flex; gap: 1rem;">
                        <input type="date" class="form-control" id="export-fecha-desde">
                        <input type="date" class="form-control" id="export-fecha-hasta">
                    </div>
                </div>
                
                <div style="text-align: center; padding: 2rem;">
                    <button class="btn btn-primary" onclick="exportarDatos()" style="padding: 1rem 2rem; font-size: 1.1rem;">
                        📥 Generar y Descargar
                    </button>
                    <p style="margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                        Los datos se generarán según los filtros seleccionados
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Tab Configuración -->
        <div id="tab-configuracion" class="tab-content" role="tabpanel" aria-labelledby="configuracion-tab">
            <h2>⚙️ Configuración</h2>
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <label class="form-label">Auto-refresh:</label>
                    <select class="form-control" id="refresh-interval" onchange="actualizarRefreshInterval()">
                        <option value="0">Desactivado</option>
                        <option value="30">Cada 30 segundos</option>
                        <option value="60" selected>Cada 1 minuto</option>
                        <option value="300">Cada 5 minutos</option>
                        <option value="600">Cada 10 minutos</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Notificaciones:</label>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="notif-citas" checked> Nuevas citas
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="notif-leads" checked> Nuevos leads
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="notif-recordatorios" checked> Recordatorios
                        </label>
                    </div>
                </div>
                
                <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <button class="btn btn-primary" onclick="guardarConfiguracion()">
                        💾 Guardar Configuración
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Nueva Cita -->
    <div class="modal" id="modal-nueva-cita">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0;">➕ Nueva Cita</h3>
                <button class="modal-close" onclick="cerrarModal('modal-nueva-cita')">×</button>
            </div>
            <form id="form-nueva-cita" onsubmit="crearNuevaCita(event)">
                <div class="form-group">
                    <label class="form-label">Nombre del cliente *</label>
                    <input type="text" class="form-control" id="nuevo-nombre" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel" class="form-control" id="nuevo-telefono" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="nuevo-email">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Fecha *</label>
                    <input type="date" class="form-control" id="nuevo-fecha" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Hora *</label>
                    <input type="time" class="form-control" id="nuevo-hora" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Propiedad *</label>
                    <input type="text" class="form-control" id="nuevo-propiedad" required placeholder="ID o nombre de la propiedad">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Notas adicionales</label>
                    <textarea class="form-control" id="nuevo-notas" rows="3"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="cerrarModal('modal-nueva-cita')">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Agendar Cita
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal Recordatorio -->
    <div class="modal" id="modal-recordatorio">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0;">🔔 Enviar Recordatorio</h3>
                <button class="modal-close" onclick="cerrarModal('modal-recordatorio')">×</button>
            </div>
            <div id="recordatorio-content">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;"></div>
    
    <script>
        // Variables globales
        let todasLasCitas = [];
        let todosLosLeads = [];
        let refreshInterval = null;
        let adminKey = '';
        let currentCitaId = '';
        
        // Configuración por defecto
        let configuracion = {
            autoRefresh: 60,
            notificaciones: {
                citas: true,
                leads: true,
                recordatorios: true
            }
        };
        
        // Obtener clave de la URL
        function obtenerClaveURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('key');
        }
        
        // Validar acceso
        function validarAcceso() {
            adminKey = obtenerClaveURL();
            if (!adminKey) {
                alert('⚠️ Acceso no autorizado. Se requiere clave de acceso.');
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // Helper para fetch con clave
        async function fetchConClave(url, options = {}) {
            const urlConClave = url.includes('?') ? `${url}&key=${adminKey}` : `${url}?key=${adminKey}`;
            
            try {
                const response = await fetch(urlConClave, options);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                mostrarToast(`❌ Error: ${error.message}`, 'error');
                throw error;
            }
        }
        
        // Formatear fechas
        function formatearFecha(fechaISO) {
            try {
                const fecha = new Date(fechaISO);
                return fecha.toLocaleDateString('es-ES', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }).replace(/^\w/, c => c.toUpperCase());
            } catch {
                return fechaISO;
            }
        }
        
        function formatearHora(hora) {
            return hora.replace(/^(\d{1,2}):(\d{2})$/, (match, h, m) => {
                const horas = parseInt(h);
                return `${horas.toString().padStart(2, '0')}:${m} hs`;
            });
        }
        
        // Mostrar mensajes toast
        function mostrarToast(mensaje, tipo = 'success', duracion = 5000) {
            const container = document.getElementById('toast-container');
            const toastId = 'toast-' + Date.now();
            
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.id = toastId;
            toast.innerHTML = `
                <div style="flex: 1;">
                    <strong>${tipo === 'success' ? '✅' : tipo === 'error' ? '❌' : '⚠️'} ${mensaje}</strong>
                </div>
                <button class="toast-close" onclick="document.getElementById('${toastId}').remove()">×</button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                const elem = document.getElementById(toastId);
                if (elem) elem.remove();
            }, duracion);
        }
        
        // Cargar datos iniciales
        async function cargarDatos() {
            if (!validarAcceso()) return;
            
            try {
                mostrarLoading('citas-container', 'Cargando citas...');
                mostrarLoading('leads-container', 'Cargando leads...');
                
                // Cargar citas
                const citasResponse = await fetchConClave('/api/citas');
                todasLasCitas = Array.isArray(citasResponse) ? citasResponse : [];
                
                // Cargar leads
                const leadsResponse = await fetchConClave('/api/leads');
                todosLosLeads = Array.isArray(leadsResponse.leads) ? leadsResponse.leads : [];
                
                // Mostrar datos
                mostrarCitas(todasLasCitas);
                mostrarLeads(todosLosLeads);
                actualizarEstadisticas();
                
            } catch (error) {
                console.error('Error cargando datos:', error);
                mostrarEmptyState('citas-container', 'Error al cargar citas', '❌');
                mostrarEmptyState('leads-container', 'Error al cargar leads', '❌');
            }
        }
        
        // Mostrar citas
        function mostrarCitas(citas) {
            const container = document.getElementById('citas-container');
            
            if (!citas || citas.length === 0) {
                mostrarEmptyState('citas-container', 'No hay citas agendadas', '📭');
                return;
            }
            
            let html = '';
            citas.forEach(cita => {
                const fechaFormateada = formatearFecha(cita.fecha);
                const horaFormateada = formatearHora(cita.hora);
                
                html += `
                    <div class="cita-card" data-id="${cita.id}" data-estado="${cita.estado}">
                        <div class="card-header">
                            <span class="card-id">#${cita.id || 'N/A'}</span>
                            <span class="status-badge status-${cita.estado || 'pendiente'}">
                                ${cita.estado === 'pendiente' ? '⏳' : 
                                  cita.estado === 'confirmada' ? '✅' : 
                                  cita.estado === 'completada' ? '🏁' : '❌'}
                                ${(cita.estado || 'pendiente').toUpperCase()}
                            </span>
                        </div>
                        
                        <div class="card-content">
                            <h3 style="margin: 0 0 1rem 0; font-size: 1.2rem;">${cita.nombre || 'Sin nombre'}</h3>
                            
                            <div class="card-row">
                                <span>📞</span>
                                <span>${cita.telefono || 'N/A'}</span>
                            </div>
                            
                            ${cita.email ? `
                            <div class="card-row">
                                <span>📧</span>
                                <span>${cita.email}</span>
                            </div>
                            ` : ''}
                            
                            <div class="card-row">
                                <span>📅</span>
                                <span>${fechaFormateada}</span>
                            </div>
                            
                            <div class="card-row">
                                <span>⏰</span>
                                <span>${horaFormateada}</span>
                            </div>
                            
                            ${cita.propiedad_id || cita.propiedad_titulo ? `
                            <div class="property-info">
                                <strong>🏠 Propiedad:</strong><br>
                                ${cita.propiedad_titulo || cita.propiedad_id || 'N/A'}
                            </div>
                            ` : ''}
                            
                            ${cita.notas ? `
                            <div style="margin-top: 1rem; padding: 0.75rem; background: #f8fafc; border-radius: 6px; font-size: 0.9rem;">
                                <strong>📝 Notas:</strong><br>
                                ${cita.notas}
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="card-actions">
                            ${(!cita.estado || cita.estado === 'pendiente') ? `
                                <button class="btn btn-success" onclick="cambiarEstadoCita('${cita.id}', 'confirmada')">
                                    ✅ Confirmar
                                </button>
                            ` : cita.estado === 'confirmada' ? `
                                <button class="btn btn-primary" onclick="cambiarEstadoCita('${cita.id}', 'completada')">
                                    🏁 Completar
                                </button>
                            ` : ''}
                            
                            <button class="btn btn-outline" onclick="mostrarModalRecordatorio('${cita.id}')">
                                🔔 Recordatorio
                            </button>
                            
                            ${cita.estado !== 'cancelada' && cita.estado !== 'completada' ? `
                                <button class="btn btn-danger" onclick="cambiarEstadoCita('${cita.id}', 'cancelada')">
                                    ❌ Cancelar
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Mostrar leads
        function mostrarLeads(leads) {
            const container = document.getElementById('leads-container');
            
            if (!leads || leads.length === 0) {
                mostrarEmptyState('leads-container', 'No hay leads registrados', '👤');
                return;
            }
            
            let html = '';
            leads.forEach(lead => {
                const fecha = lead.timestamp ? formatearFecha(lead.timestamp) : 'Fecha no disponible';
                
                html += `
                    <div class="lead-card" data-id="${lead.user_id || lead.id}">
                        <div class="card-header">
                            <span class="card-id">#${lead.user_id ? lead.user_id.slice(-6) : 'N/A'}</span>
                            <span class="status-badge ${lead.accion === 'lead_completo' ? 'status-confirmada' : 'status-pendiente'}">
                                ${lead.accion === 'lead_completo' ? '📞 CONTACTADO' : '🆕 NUEVO'}
                            </span>
                        </div>
                        
                        <div class="card-content">
                            <h3 style="margin: 0 0 1rem 0; font-size: 1.2rem;">Cliente ${lead.user_id ? lead.user_id.slice(-4) : 'N/A'}</h3>
                            
                            <div class="card-row">
                                <span>📞</span>
                                <span>${lead.user_id || 'N/A'}</span>
                            </div>
                            
                            <div class="card-row">
                                <span>📅</span>
                                <span>${fecha}</span>
                            </div>
                            
                            <div class="card-row">
                                <span>📊</span>
                                <span>Acción: ${lead.accion || 'N/A'}</span>
                            </div>
                            
                            ${lead.detalle ? `
                            <div style="margin-top: 1rem; padding: 0.75rem; background: #f8fafc; border-radius: 6px; font-size: 0.9rem;">
                                <strong>📝 Detalle:</strong><br>
                                ${lead.detalle}
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="contactarLead('${lead.user_id}')">
                                📞 Contactar
                            </button>
                            <button class="btn btn-outline" onclick="agendarCitaDesdeLead('${lead.user_id}')">
                                📅 Agendar Cita
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Actualizar estadísticas
        function actualizarEstadisticas() {
            const hoy = new Date().toISOString().split('T')[0];
            
            const estadisticas = {
                totalCitas: todasLasCitas.length,
                citasPendientes: todasLasCitas.filter(c => c.estado === 'pendiente').length,
                citasHoy: todasLasCitas.filter(c => c.fecha === hoy).length,
                totalLeads: todosLosLeads.length,
                leadsHoy: todosLosLeads.filter(l => l.timestamp && l.timestamp.startsWith(hoy)).length,
                conversionRate: todasLasCitas.length > 0 && todosLosLeads.length > 0 ? 
                    (todasLasCitas.length / todosLosLeads.length * 100).toFixed(1) : 0
            };
            
            const statsHTML = `
                <div class="stat-card">
                    <div class="stat-number">${estadisticas.totalCitas}</div>
                    <div>Total Citas</div>
                    <div class="stat-trend ${estadisticas.citasHoy > 0 ? 'up' : ''}">
                        ${estadisticas.citasHoy > 0 ? '↗' : ''} ${estadisticas.citasHoy} hoy
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${estadisticas.citasPendientes}</div>
                    <div>Citas Pendientes</div>
                    <div class="stat-trend ${estadisticas.citasPendientes > 5 ? 'warning' : 'up'}">
                        ${estadisticas.citasPendientes > 5 ? '⚠️' : ''} 
                        ${estadisticas.citasPendientes > 5 ? 'Revisar' : 'Al día'}
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${estadisticas.totalLeads}</div>
                    <div>Total Leads</div>
                    <div class="stat-trend ${estadisticas.leadsHoy > 0 ? 'up' : ''}">
                        ${estadisticas.leadsHoy > 0 ? '↗' : ''} ${estadisticas.leadsHoy} hoy
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${estadisticas.conversionRate}%</div>
                    <div>Tasa Conversión</div>
                    <div class="stat-trend ${estadisticas.conversionRate > 30 ? 'up' : 'down'}">
                        ${estadisticas.conversionRate > 30 ? '↗ Excelente' : '↗ Mejorable'}
                    </div>
                </div>
            `;
            
            document.getElementById('stats-grid').innerHTML = statsHTML;
        }
        
        // Estados loading/empty
        function mostrarLoading(containerId, mensaje = 'Cargando...') {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>${mensaje}</p>
                </div>
            `;
        }
        
        function mostrarEmptyState(containerId, mensaje = 'No hay datos disponibles', icon = '📭') {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="empty-state">
                    <div>${icon}</div>
                    <h3 style="margin-bottom: 0.5rem;">${mensaje}</h3>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Intenta cambiar los filtros o crear nuevos registros</p>
                </div>
            `;
        }
        
        // Funciones de gestión
        async function cambiarEstadoCita(citaId, nuevoEstado) {
            if (!confirm(`¿Cambiar estado de la cita #${citaId} a ${nuevoEstado}?`)) return;
            
            try {
                mostrarToast('Actualizando estado...', 'info');
                
                await fetchConClave(`/api/citas/${citaId}/estado?estado=${nuevoEstado}`, {
                    method: 'PUT'
                });
                
                // Actualizar localmente
                const index = todasLasCitas.findIndex(c => c.id === citaId);
                if (index !== -1) {
                    todasLasCitas[index].estado = nuevoEstado;
                    todasLasCitas[index].ultima_actualizacion = new Date().toISOString();
                    mostrarCitas(todasLasCitas);
                    actualizarEstadisticas();
                }
                
                mostrarToast(`✅ Estado cambiado a ${nuevoEstado}`, 'success');
                
            } catch (error) {
                console.error('Error cambiando estado:', error);
            }
        }
        
        async function crearNuevaCita(event) {
            event.preventDefault();
            
            const formData = {
                nombre: document.getElementById('nuevo-nombre').value,
                telefono: document.getElementById('nuevo-telefono').value,
                email: document.getElementById('nuevo-email').value,
                fecha: document.getElementById('nuevo-fecha').value,
                hora: document.getElementById('nuevo-hora').value,
                propiedad: document.getElementById('nuevo-propiedad').value,
                notas: document.getElementById('nuevo-notas').value
            };
            
            // Validar datos
            if (!formData.nombre || !formData.telefono || !formData.fecha || !formData.hora) {
                mostrarToast('❌ Por favor completa todos los campos obligatorios', 'error');
                return;
            }
            
            try {
                mostrarToast('Creando cita...', 'info');
                
                // Usar la función crear_cita del backend
                const response = await fetchConClave('/api/panel/citas/nueva', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (response.status === 'success') {
                    mostrarToast(`✅ Cita creada para ${formData.nombre}`, 'success');
                    cerrarModal('modal-nueva-cita');
                    event.target.reset();
                    
                    // Recargar datos
                    cargarDatos();
                    
                    // Cambiar a tab de citas
                    mostrarTab('citas');
                } else {
                    mostrarToast(`❌ Error: ${response.error}`, 'error');
                }
                
            } catch (error) {
                console.error('Error creando cita:', error);
                mostrarToast('❌ Error al crear la cita', 'error');
            }
        }
        
        function contactarLead(telefono) {
            if (telefono) {
                window.open(`https://wa.me/${telefono}`, '_blank');
            }
        }
        
        function agendarCitaDesdeLead(telefono) {
            if (telefono) {
                document.getElementById('nuevo-telefono').value = telefono;
                mostrarModalNuevaCita();
            }
        }
        
        async function mostrarModalRecordatorio(citaId) {
            currentCitaId = citaId;
            const cita = todasLasCitas.find(c => c.id === citaId);
            
            if (!cita) {
                mostrarToast('❌ Cita no encontrada', 'error');
                return;
            }
            
            const content = `
                <div class="form-group">
                    <label class="form-label">Cliente:</label>
                    <p><strong>${cita.nombre}</strong></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Teléfono:</label>
                    <p><strong>${cita.telefono}</strong></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Mensaje de recordatorio:</label>
                    <textarea class="form-control" id="mensaje-recordatorio" rows="4">
🔔 *RECORDATORIO DANTE PROPIEDADES*

Hola ${cita.nombre}, este es un recordatorio de tu cita:

📅 Fecha: ${formatearFecha(cita.fecha)}
⏰ Hora: ${formatearHora(cita.hora)}
🏠 Propiedad: ${cita.propiedad_titulo || cita.propiedad_id || 'Propiedad seleccionada'}

📍 Por favor, llega 10 minutos antes.
📱 Para cambios, contacta al +5491151511579

¡Te esperamos! 🏠🗝️
                    </textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="cerrarModal('modal-recordatorio')">
                        Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" style="flex: 1;" onclick="enviarRecordatorio()">
                        📤 Enviar WhatsApp
                    </button>
                </div>
            `;
            
            document.getElementById('recordatorio-content').innerHTML = content;
            document.getElementById('modal-recordatorio').classList.add('active');
        }
        
        async function enviarRecordatorio() {
            const mensaje = document.getElementById('mensaje-recordatorio').value;
            
            try {
                // Usar la función send_whatsapp_message del backend
                const cita = todasLasCitas.find(c => c.id === currentCitaId);
                
                const response = await fetchConClave('/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: cita.telefono,
                        message: mensaje
                    })
                });
                
                if (response.ok) {
                    mostrarToast('✅ Recordatorio enviado', 'success');
                    cerrarModal('modal-recordatorio');
                } else {
                    mostrarToast('❌ Error enviando recordatorio', 'error');
                }
                
            } catch (error) {
                console.error('Error enviando recordatorio:', error);
                mostrarToast('❌ Error enviando recordatorio', 'error');
            }
        }
        
        // Funciones de filtrado
        function filtrarCitas(termino) {
            const citasFiltradas = todasLasCitas.filter(cita => {
                const busqueda = termino.toLowerCase();
                return (
                    (cita.nombre && cita.nombre.toLowerCase().includes(busqueda)) ||
                    (cita.telefono && cita.telefono.includes(busqueda)) ||
                    (cita.propiedad_titulo && cita.propiedad_titulo.toLowerCase().includes(busqueda)) ||
                    (cita.propiedad_id && cita.propiedad_id.toLowerCase().includes(busqueda))
                );
            });
            
            mostrarCitas(citasFiltradas);
        }
        
        function filtrarCitasPorEstado(estado) {
            if (!estado) {
                mostrarCitas(todasLasCitas);
                return;
            }
            
            const citasFiltradas = todasLasCitas.filter(cita => cita.estado === estado);
            mostrarCitas(citasFiltradas);
        }
        
        function filtrarLeads(termino) {
            const leadsFiltrados = todosLosLeads.filter(lead => {
                const busqueda = termino.toLowerCase();
                return (
                    (lead.user_id && lead.user_id.includes(busqueda)) ||
                    (lead.detalle && lead.detalle.toLowerCase().includes(busqueda)) ||
                    (lead.accion && lead.accion.toLowerCase().includes(busqueda))
                );
            });
            
            mostrarLeads(leadsFiltrados);
        }
        
        function filtrarLeadsPorFuente(fuente) {
            if (!fuente) {
                mostrarLeads(todosLosLeads);
                return;
            }
            
            const leadsFiltrados = todosLosLeads.filter(lead => {
                // Simular fuentes basadas en la acción
                if (fuente === 'whatsapp') return true; // Todos son de WhatsApp
                if (fuente === 'telefono') return lead.accion === 'lead_caliente_oferta';
                return false;
            });
            
            mostrarLeads(leadsFiltrados);
        }
        
        // Exportar datos
        function exportarDatos() {
            const tipo = document.getElementById('export-type').value;
            
            if (tipo === 'excel') {
                // Descargar archivo Excel completo
                window.open(`/api/leads-file?key=${adminKey}`, '_blank');
                mostrarToast('📥 Descargando archivo Excel...', 'success');
            } else if (tipo === 'citas') {
                // Crear CSV de citas
                const csvContent = "data:text/csv;charset=utf-8," 
                    + "ID,Nombre,Telefono,Email,Fecha,Hora,Propiedad,Estado,Notas\n"
                    + todasLasCitas.map(c => 
                        `"${c.id || ''}","${c.nombre || ''}","${c.telefono || ''}","${c.email || ''}",`
                        + `"${c.fecha || ''}","${c.hora || ''}","${c.propiedad_titulo || c.propiedad_id || ''}",`
                        + `"${c.estado || ''}","${c.notas || ''}"`
                    ).join("\n");
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `citas_dante_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                mostrarToast('📥 Archivo CSV descargado', 'success');
            } else if (tipo === 'leads') {
                // Crear CSV de leads
                const csvContent = "data:text/csv;charset=utf-8," 
                    + "Telefono,Accion,Detalle,Fecha\n"
                    + todosLosLeads.map(l => 
                        `"${l.user_id || ''}","${l.accion || ''}","${l.detalle || ''}","${l.timestamp || ''}"`
                    ).join("\n");
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `leads_dante_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                mostrarToast('📥 Archivo CSV descargado', 'success');
            }
        }
        
        // Funciones de UI
        function mostrarTab(tabName) {
            // Actualizar tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Mostrar tab seleccionado
            const tabContent = document.getElementById(`tab-${tabName}`);
            const tabButton = document.querySelector(`.tab[onclick="mostrarTab('${tabName}')"]`);
            
            if (tabContent && tabButton) {
                tabContent.classList.add('active');
                tabButton.classList.add('active');
            }
            
            // Guardar última tab visitada
            localStorage.setItem('ultima_tab', tabName);
        }
        
        function mostrarModalNuevaCita() {
            // Setear fecha mínima a hoy
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('nuevo-fecha').min = hoy;
            document.getElementById('nuevo-fecha').value = hoy;
            
            // Setear hora por defecto (09:00)
            document.getElementById('nuevo-hora').value = '09:00';
            
            document.getElementById('modal-nueva-cita').classList.add('active');
        }
        
        function cerrarModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function guardarConfiguracion() {
            const refreshValue = parseInt(document.getElementById('refresh-interval').value);
            const notifCitas = document.getElementById('notif-citas').checked;
            const notifLeads = document.getElementById('notif-leads').checked;
            const notifRecordatorios = document.getElementById('notif-recordatorios').checked;
            
            configuracion = {
                autoRefresh: refreshValue,
                notificaciones: {
                    citas: notifCitas,
                    leads: notifLeads,
                    recordatorios: notifRecordatorios
                }
            };
            
            localStorage.setItem('configuracion_panel', JSON.stringify(configuracion));
            actualizarRefreshInterval();
            
            mostrarToast('✅ Configuración guardada', 'success');
        }
        
        function cargarConfiguracion() {
            const savedConfig = localStorage.getItem('configuracion_panel');
            if (savedConfig) {
                configuracion = JSON.parse(savedConfig);
                
                document.getElementById('refresh-interval').value = configuracion.autoRefresh;
                document.getElementById('notif-citas').checked = configuracion.notificaciones.citas;
                document.getElementById('notif-leads').checked = configuracion.notificaciones.leads;
                document.getElementById('notif-recordatorios').checked = configuracion.notificaciones.recordatorios;
            }
        }
        
        function actualizarRefreshInterval() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            
            const interval = parseInt(document.getElementById('refresh-interval').value) * 1000;
            if (interval > 0) {
                refreshInterval = setInterval(cargarDatos, interval);
                console.log(`Auto-refresh configurado a ${interval/1000} segundos`);
            }
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            if (validarAcceso()) {
                // Cargar configuración
                cargarConfiguracion();
                
                // Cargar datos
                cargarDatos();
                
                // Configurar auto-refresh
                actualizarRefreshInterval();
                
                // Restaurar última tab
                const ultimaTab = localStorage.getItem('ultima_tab') || 'citas';
                mostrarTab(ultimaTab);
                
                // Actualizar información de usuario
                document.getElementById('user-info').innerHTML = `
                    <span>👤 Dante Propiedades</span>
                    <span style="opacity: 0.7;">Administrador</span>
                `;
            }
        });
        
        // Manejar conexión/desconexión
        window.addEventListener('online', () => {
            mostrarToast('✅ Conexión restablecida', 'success');
            cargarDatos();
        });
        
        window.addEventListener('offline', () => {
            mostrarToast('⚠️ Sin conexión a internet', 'warning');
        });
    </script>
</body>
</html>
