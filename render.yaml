# ========== RENDER BLUEPRINT ==========
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chatbot-inmobiliario
    runtime: python
    region: oregon  # o frankfurt para mejor latencia a Argentina

    # Repositorio (actualizar con tu repo)
    # repo: https://github.com/tu-usuario/chatbot-inmobiliario

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000

      # Variables sensibles (configurar en Render Dashboard)
      - key: VERIFY_TOKEN
        sync: false  # Configurar manualmente en Render
      - key: ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false

    healthCheckPath: /health
    autoDeploy: true  # Deploy automático con cada push
